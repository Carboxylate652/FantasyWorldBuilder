[package]
name = "fwm-update"
version.workspace = true
edition.workspace = true
description = "Checks GitHub for a newer Fantasy World Maker release and fetches it"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json", "native-certs", "proxy-from-env"] }
