[package]
name = "fwm-guide"
version.workspace = true
edition.workspace = true
description = "AI-guided history: an LLM steers the Stage 3 and 4 simulations toward the user's goal"

[dependencies]
worldcore = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "native-certs", "proxy-from-env"] }

[dev-dependencies]
tiny_http = "0.12"
