# Checks on every push and pull request: core and updater tests, the CLI,
# the UI typecheck and build, and a compile of the desktop shell (Linux; the
# Windows installer is built by release-windows.yml).

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Desktop shell build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: UI typecheck and build
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Core, updater and guide tests
        run: cargo test --release -p worldcore -p fwm-update -p fwm-guide

      - name: CLI smoke test (generate to Stage 4, directive, validate, overrides, export)
        run: |
          cargo build --release -p worldgen
          W="$RUNNER_TEMP/world"
          ./target/release/worldgen generate --out "$W" --seed 3 --level 5 --to nations
          ./target/release/worldgen edit "$W" --tool fertility_paint --at 10,20 --value 0.5
          ./target/release/worldgen directive "$W" --stage nations --at 1500 --action note --args '{"text":"smoke test"}'
          ./target/release/worldgen overrides "$W" export "$RUNNER_TEMP/edits.json"
          ./target/release/worldgen validate "$W" --run
          ./target/release/worldgen overrides "$W"
          ./target/release/worldgen export "$W" --width 1024 --height 512

      - name: Desktop shell compiles
        run: cargo build -p worldbuilder-app
